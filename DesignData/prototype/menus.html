<html lang="en"><head><meta charset="utf-8"><title>Dawnwager Menus</title>
<style>
@font-face{font-family:Display;src:url(Display.ttf)}
@font-face{font-family:Body;src:url(Body.ttf)}
:root{--brass:#c9a55c;--gold:#f0c75e;--muted:#b6bfc4;--ink:#2f2820;--glass:rgba(9,13,19,.74);--line:rgba(201,165,92,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#05070a;overflow:hidden;font-family:Body,Georgia,serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0b1118}
img{display:block;-webkit-user-drag:none}
.abs{position:absolute}
.disp{font-family:Display,Georgia,serif;font-variant:small-caps;letter-spacing:.03em}
.ol{text-shadow:0 2px 0 #000,0 0 6px #000,0 0 2px #000}
.center{display:flex;align-items:center;justify-content:center;text-align:center}
#stage div{text-shadow:0 1px 2px rgba(0,0,0,.6)}
.glass{position:absolute;background:var(--glass);border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.03);backdrop-filter:blur(8px)}
.glass:before,.glass:after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--gold);opacity:.8}
.glass:before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:5px 0 0 0}
.glass:after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 5px 0}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;font-family:Display;font-variant:small-caps;letter-spacing:.06em;cursor:pointer;border-radius:999px;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(#ffe08a,#d9a33a 55%,#a8731d);color:#2a1b06;border:2px solid #5b3d0e;box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6);text-shadow:0 1px 0 rgba(255,255,255,.35)!important}
.btn.sec{background:rgba(10,14,20,.8);color:#f1dfae;border:1.5px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.btn.dng{background:rgba(60,12,20,.8);color:#ffb4a8;border:1.5px solid rgba(220,90,80,.6)}
.btn.off{filter:grayscale(1) brightness(.6);pointer-events:none}
.tab{position:absolute;display:flex;align-items:center;justify-content:center;font-family:Display;font-variant:small-caps;letter-spacing:.05em;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.bar{position:absolute;height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c58a2a,#ffe08a);border-radius:5px}
.chip{position:absolute;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;background:rgba(10,14,20,.7);color:#e9d9ac;font-size:20px;cursor:pointer}
.chip.on{background:rgba(240,199,94,.18);border-color:var(--gold);color:var(--gold)}
.lbl{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:16px}
.sw{position:absolute;width:64px;height:32px;border-radius:16px;background:#2a323c;border:1px solid var(--line)}
.sw i{position:absolute;top:3px;left:4px;width:24px;height:24px;border-radius:50%;background:#8a949c}
.sw.on{background:#6b4d12}.sw.on i{left:34px;background:var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in{animation:rise .5s both}
/* ---- card ---- */
.cardwrap{position:absolute;transition:transform .22s cubic-bezier(.2,.8,.2,1),filter .2s;transform-origin:50% 100%;cursor:pointer}
.card{position:absolute;left:0;top:0;width:416px;height:590px;transform-origin:0 0}
.card .well{position:absolute;left:34px;top:56px;width:348px;height:296px;overflow:hidden;background:#0a0e14}
.card .well .bd{position:absolute;inset:0}
.card .well img.art{position:absolute}
.card .foil{position:absolute;top:0;left:-100px;width:88px;height:296px;mix-blend-mode:screen;opacity:.0;animation:foil 5.5s ease-in-out infinite}
@keyframes foil{0%,55%{left:-100px;opacity:0}60%{opacity:.9}85%{opacity:.9}100%{left:360px;opacity:0}}
.card .nm{position:absolute;left:58px;top:330px;width:300px;height:44px;font-size:25px;color:#fff;white-space:nowrap}
.card .tl{position:absolute;left:50px;top:374px;width:316px;height:28px;font-size:16px;color:#decda8}
.card .rules{position:absolute;left:56px;top:416px;width:304px;height:108px;font-size:21px;line-height:1.12;color:var(--ink);padding:2px}
.card .med{position:absolute;width:72px;height:72px}
.card .med span{position:absolute;inset:0;font-size:38px;font-family:Display;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 0 #000,0 0 5px #000}

#dev{position:absolute;left:0;right:0;bottom:0;height:34px;background:#05070a;border-top:1px solid #222;display:flex;gap:2px;overflow-x:auto;z-index:9;padding:0 6px;align-items:center}
#dev a{font:600 12px system-ui;color:#8aa;padding:5px 9px;border-radius:4px;cursor:pointer;white-space:nowrap;text-decoration:none}
#dev a.on{background:#c9a55c;color:#201505}
</style></head>

function artFit(key,W,H,zoom,fade){const b=BB[key];if(!b)return `width:${W}px;left:0;top:0`;
  const bw=b[2]-b[0],bh=b[3]-b[1],sc=(fade?(W*1.1)/bw:Math.max(W/bw,H/bh))*(zoom||1),w=512*sc;
  const left=W/2-((b[0]+b[2])/2)*sc,top=-b[1]*sc+H*.02;
  return `width:${w.toFixed(1)}px;left:${left.toFixed(1)}px;top:${top.toFixed(1)}px`+(fade?`;-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 99%);mask-image:linear-gradient(to bottom,#000 80%,transparent 99%)`:'')}

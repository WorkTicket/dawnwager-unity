<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dawnwager battle table prototype</title>
<style>
@font-face{font-family:Display;src:url(Display.ttf)}
@font-face{font-family:Body;src:url(Body.ttf)}
:root{--brass:#c9a55c;--gold:#f0c75e;--muted:#b6bfc4;--sage:#b4d3c1;--copper:#e19781;--frost:#9fd6ee;--ink:#2f2820}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#05070a;overflow:hidden;font-family:Body,Georgia,serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0b1118}
.abs{position:absolute}
img{display:block;-webkit-user-drag:none}
.fill{position:absolute;inset:0;width:100%;height:100%}
.disp{font-family:Display,Georgia,serif;font-variant:small-caps;letter-spacing:.02em}
.ol{text-shadow:0 2px 0 #000,0 0 6px #000,0 0 2px #000}
.center{display:flex;align-items:center;justify-content:center;text-align:center}

/* ---- card ---- */
.cardwrap{position:absolute;transition:transform .22s cubic-bezier(.2,.8,.2,1),filter .2s;transform-origin:50% 100%;cursor:pointer}
.card{position:absolute;left:0;top:0;width:416px;height:590px;transform-origin:0 0}
.card .well{position:absolute;left:34px;top:56px;width:348px;height:296px;overflow:hidden;background:#0a0e14}
.card .well .bd{position:absolute;inset:0}
.card .well img.art{position:absolute}
.card .foil{position:absolute;top:0;left:-100px;width:88px;height:296px;mix-blend-mode:screen;opacity:.0;animation:foil 5.5s ease-in-out infinite}
@keyframes foil{0%,55%{left:-100px;opacity:0}60%{opacity:.9}85%{opacity:.9}100%{left:360px;opacity:0}}
.card .nm{position:absolute;left:58px;top:330px;width:300px;height:44px;font-size:25px;color:#fff;white-space:nowrap}
.card .tl{position:absolute;left:50px;top:374px;width:316px;height:28px;font-size:16px;color:#decda8}
.card .rules{position:absolute;left:56px;top:416px;width:304px;height:108px;font-size:21px;line-height:1.12;color:var(--ink);padding:2px}
.card .med{position:absolute;width:72px;height:72px}
.card .med span{position:absolute;inset:0;font-size:38px;font-family:Display;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 0 #000,0 0 5px #000}

/* ---- tiles ---- */
.tile{position:absolute;width:176px;height:220px;transform:scale(1.04);transform-origin:50% 0;filter:drop-shadow(0 10px 8px rgba(0,0,0,.55))}
.tile .disc{position:absolute;left:28px;top:34px;width:120px;height:152px;border-radius:50%;overflow:hidden}
.tile .disc .bd{position:absolute;inset:0}
.tile .disc img.art{position:absolute}
.tile .tok{position:absolute;left:0;top:0;width:176px;height:220px}
.tile .med{position:absolute;width:62px;height:62px}
.tile .med span{position:absolute;inset:0;font-size:30px;font-family:Display;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 0 #000,0 0 5px #000}
.tile .tn{position:absolute;left:50px;top:182px;width:76px;height:26px;font-size:14px;line-height:.95}
.tile .np{position:absolute;left:44px;top:180px;width:88px;height:30px;opacity:.92}
.sock{position:absolute;background:rgba(0,0,0,.22);border:1px solid rgba(201,165,92,.28)}
.sock img{position:absolute;left:50%;top:50%;width:70px;margin:-35px 0 0 -35px;opacity:.16}

/* ---- hero ---- */
.hero{position:absolute;width:240px;height:330px;}
.hero .ring{position:absolute;left:35px;top:0;width:170px;height:170px}
.hero .disc{position:absolute;left:50px;top:15px;width:140px;height:140px;border-radius:50%;overflow:hidden}
.hero .disc .bd{position:absolute;inset:0}
.hero .disc img.art{position:absolute}
.breathe{animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.018) translateY(-1px)}}


/* plain tinted backdrop behind cut-out art */
.fbd{position:absolute;inset:0;background:linear-gradient(to bottom,var(--t,#4f7aa8),#141c28)}
@keyframes bands{to{transform:translateX(18%)}}
@keyframes sheen{0%{background-position:150% 0,0 0,10px 15px}100%{background-position:-50% 0,0 0,10px 15px}}
@keyframes ban{0%{opacity:0;transform:scaleY(.4)}18%{opacity:1;transform:scaleY(1)}75%{opacity:1}100%{opacity:0}}
@keyframes glowp{50%{opacity:.55}}
.glowimg{animation:glowp 2.4s ease-in-out infinite}
.tile{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{margin-top:-3px}}
.panel{position:absolute}
.lanehead{position:absolute;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 44px 0 40px}
</style></head>
<body><div id="stage"></div>
<script>
const A='Art/', F=A+'Foundry/';
const ACC={A:'#3f7fc4',H:'#c26a3a',J:'#7a9a4a',L:'#8a5ac0',M:'#4aa59a',N:'#9aa7b8',X:'#b08a40'};
const CARDS=[
 {n:'Hold the Span',f:'A',k:'Order',art:'Orders/A03',cost:3,type:'Asgard Order',rules:'Choose a lane.'},
 {n:'Fisher of the Sound',f:'X',k:'Unit',art:'Units/X02',cost:2,a:2,h:3,type:'Neutral Unit',rules:'No special ability.'},
 {n:'Einherjar Muster',f:'A',k:'Order',art:'Orders/A04',cost:3,type:'Asgard Order',rules:'Choose a lane.'},
 {n:'Hall Healer',f:'A',k:'Unit',art:'Units/A09',cost:4,a:2,h:4,type:'Asgard Unit',rules:'Deploy: Heal your strongest wounded unit 3.'},
 {n:'Sigrun Standard',f:'A',k:'Unit',art:'Units/A10',cost:5,a:4,h:4,type:'Asgard Unit',rules:'Allies in this lane gain +1 Attack.',mythic:true},
];
const BB={"Units/A09": [5, 2, 505, 509], "Units/A10": [8, 2, 488, 509], "Units/H05": [6, 3, 505, 509], "Units/H09": [22, 3, 486, 509], "Units/J05": [9, 18, 508, 491], "Units/X02": [5, 4, 509, 506], "Heroes/A23": [1, 25, 509, 486], "Heroes/H23": [17, 8, 493, 510]};
function cutFit(key,W,H){W=W||176;H=H||184;const b=BB[key];if(!b)return `width:${W-6}px;left:3px;top:0`;const bw=b[2]-b[0],bh=b[3]-b[1],sc=Math.min((W-12)/bw,H/bh),w=512*sc;return `position:absolute;width:${w.toFixed(1)}px;left:${(W/2-((b[0]+b[2])/2)*sc).toFixed(1)}px;top:${(-b[1]*sc+4).toFixed(1)}px;-webkit-mask-image:linear-gradient(to bottom,#000 84%,transparent 99%);mask-image:linear-gradient(to bottom,#000 84%,transparent 99%)`}
function artFit(key,W,H,zoom,fade){const b=BB[key];if(!b)return `width:${W}px;left:0;top:0`;
  const bw=b[2]-b[0],bh=b[3]-b[1],sc=(fade?(W*1.1)/bw:Math.max(W/bw,H/bh))*(zoom||1),w=512*sc;
  const left=W/2-((b[0]+b[2])/2)*sc,top=-b[1]*sc+H*.02;
  return `width:${w.toFixed(1)}px;left:${left.toFixed(1)}px;top:${top.toFixed(1)}px`+(fade?`;-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 99%);mask-image:linear-gradient(to bottom,#000 80%,transparent 99%)`:'')}

// ---- stat badges: attack (gold coin), health (crimson drop), cost/charge (blue crystal)
let _bid=0;
function numTxt(v,cx,cy,fs){const f=String(v).length>1?fs*.82:fs;return `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-family="Body,Georgia,serif" font-weight="700" font-size="${f}" fill="#fff" stroke="#10131a" stroke-width="4.2" paint-order="stroke" stroke-linejoin="round">${v}</text>`}
function atkBadge(v,sz){const i=++_bid;return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" style="overflow:visible;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6))"><defs><radialGradient id="ag${i}" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#fff0b0"/><stop offset=".45" stop-color="#e5a933"/><stop offset="1" stop-color="#8b5a14"/></radialGradient></defs>
 <circle cx="32" cy="32" r="30" fill="url(#ag${i})" stroke="#2b1c08" stroke-width="3"/><circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/><circle cx="32" cy="32" r="26.5" fill="none" stroke="rgba(60,30,0,.55)" stroke-width="1.5"/>
 <ellipse cx="25" cy="15" rx="14" ry="7" fill="rgba(255,255,255,.4)" transform="rotate(-18 25 15)"/>${numTxt(v,32,34,30)}</svg>`}
function hpBadge(v,sz){const i=++_bid;return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" style="overflow:visible;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6))"><defs><radialGradient id="hg${i}" cx=".38" cy=".4" r=".8"><stop offset="0" stop-color="#ff9a86"/><stop offset=".5" stop-color="#d12c3d"/><stop offset="1" stop-color="#6e0c20"/></radialGradient></defs>
 <path d="M32 3 C32 3 56 25 56 40 A24 24 0 0 1 8 40 C8 25 32 3 32 3 Z" fill="url(#hg${i})" stroke="#2c0710" stroke-width="3" stroke-linejoin="round"/>
 <path d="M32 9 C32 9 51 27 51 40" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/><ellipse cx="22" cy="34" rx="6" ry="10" fill="rgba(255,255,255,.28)" transform="rotate(14 22 34)"/>${numTxt(v,32,41,28)}</svg>`}
function gem(sz,on,txt){const i=++_bid;return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" style="overflow:visible;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))${on?' drop-shadow(0 0 8px rgba(90,190,255,.7))':''}"><defs><linearGradient id="gg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${on?'#b8f1ff':'#4a5667'}"/><stop offset=".5" stop-color="${on?'#3a95e8':'#2c3644'}"/><stop offset="1" stop-color="${on?'#1b45a6':'#171d27'}"/></linearGradient></defs>
 <polygon points="32,3 57,17 57,47 32,61 7,47 7,17" fill="url(#gg${i})" stroke="${on?'#0d2a66':'#0c1017'}" stroke-width="3" stroke-linejoin="round"/>
 <polygon points="32,3 57,17 32,30 7,17" fill="rgba(255,255,255,${on?.38:.12})"/><polyline points="7,17 32,30 57,17 M32,30 L32,61" fill="none" stroke="rgba(255,255,255,${on?.4:.12})" stroke-width="1.5"/>${txt!=null?numTxt(txt,32,36,28):''}</svg>`}
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const st=document.getElementById('stage');
function put(el,x,y,w,h){el.style.position='absolute';el.style.left=x+'px';el.style.top=y+'px';if(w!=null){el.style.width=w+'px';el.style.height=h+'px'}st.appendChild(el);return el}

function cardEl(c,w){
  const s=w/416,h=Math.round(590*s);
  const wrap=$(`<div class="cardwrap" style="width:${w}px;height:${h}px"></div>`);
  const kind=c.k==='Unit'?(c.mythic?'Unit-Mythic':'Unit'):c.k;
  const art=c.k==='Unit'
    ?`<div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 38%,${ACC[c.f]}66,#10161f 72%),#0b1017"></div><img class="art" src="${A+c.art}.png" style="${artFit(c.art,353,302,1.02)}">`
    :`<img class="art" src="${A+c.art}.png" style="width:348px;height:296px;object-fit:cover">`;
  const med=(src,x,y,v)=>`<div class="abs" style="left:${x}px;top:${y}px;width:72px;height:72px">${src==='Cost'?gem(72,true,v):src==='Attack'?atkBadge(v,72):hpBadge(v,72)}</div>`;
  wrap.innerHTML=`<div class="card" style="transform:scale(${s})">
    <img class="abs" src="${F}CardShadow.png" style="left:5px;top:8px;width:416px;height:590px;opacity:.4">
    ${c.glow?`<img class="abs glowimg" src="${F}CardPlayableGlow.png" style="left:0;top:0;width:416px;height:590px">`:''}
    <div class="well" style="${c.k==='Unit'?'left:30px;top:50px;width:353px;height:302px':''}">${art}<img class="foil" src="${F}Foil-${c.f==='X'?'N':c.f}.png"></div>
    <img class="abs" src="${F}Card-${c.f}-${kind}.png" style="left:0;top:0;width:416px;height:590px">
    <img class="abs" src="${F}Nameplate.png" style="left:40px;top:330px;width:336px;height:44px">
    <div class="nm disp center ol">${c.n}</div>
    <div class="tl disp center">${c.type}</div>
    <img class="abs" src="${F}RulesParchment.png" style="left:42px;top:410px;width:332px;height:120px">
    <div class="rules center" style="font-family:Body">${c.rules}</div>
    ${med('Cost',8,8,c.cost)}
    ${c.k==='Unit'?med('Attack',8,510,c.a)+med('Health',336,510,c.h):''}
  </div>`;
  return wrap;
}

function tile(x,y,u,side,sc){
  const t=$(`<div class="tile" style="transform:scale(${sc||1})"></div>`);
  const rim=side===0?'rgba(150,235,185,.9)':'rgba(255,160,120,.9)';
  t.innerHTML=`<div class="abs" style="left:14px;top:176px;width:148px;height:30px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.65),rgba(0,0,0,0) 70%)"></div>
   ${u.ready?`<div class="abs" style="left:4px;top:150px;width:168px;height:44px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,225,150,.55),rgba(255,225,150,0) 70%)"></div>`:''}
   <img class="cut" src="${A}${u.art}.png" style="${cutFit(u.art)};filter:drop-shadow(0 0 1.5px ${rim}) drop-shadow(0 6px 8px rgba(0,0,0,.6))">
   <div class="abs" style="left:-2px;top:156px;width:58px;height:58px">${atkBadge(u.a,58)}</div>
   <div class="abs" style="left:120px;top:156px;width:58px;height:58px">${hpBadge(u.h,58)}</div>
   <img class="np" src="${F}UnitPlate.png"><div class="tn disp center ol" style="color:${u.leg?'#f0c75e':'#fff'}">${u.n}</div>
   ${u.guard?`<div class="abs disp ol" style="left:2px;top:2px;font-size:14px;color:var(--frost)">Guard</div>`:''}`;
  return put(t,x,y);
}

const SLOT={ // row geometry: [x0,x1,footY,scale]
  0:[236,926,742,1.0], 1:[318,904,448,.86]};
function lane(lx,name,contested,mine,theirs,ally,enemy,siteA,siteE){
  const W=660,Y=158;
  const site=siteA||siteE;
  const lead=mine>theirs?'#8fe0b4':mine<theirs?'#e9a083':'#b6bfc4';
  // plain text only: lane name, seal power, contested note
  put($(`<div style="text-align:center"><div class="disp ol" style="font-size:30px;letter-spacing:.2em;color:${contested?'#f0c75e':'#e4e8ea'}">${name.toUpperCase()}</div>
    <div class="ol" style="font-size:16px;margin-top:2px;color:#b6bfc4">Seal power <b style="color:${lead};font-weight:700">${mine} – ${theirs}</b>${contested?' · <span style="color:#f0c75e">Contested</span>':''}${site?' · '+site:''}</div></div>`),lx,Y+14,W,70);
  [[1,enemy,478,.9],[0,ally,742,1]].forEach(([sd,units,foot,sc])=>{
    const slotW=(W-52)/3;
    for(let k=0;k<3;k++){
      const cx=lx+26+slotW*(k+.5), u=units[k]; if(!u)continue;
      put($(`<div style="border-radius:50%;background:radial-gradient(ellipse,${u.ready?'rgba(255,214,120,.5)':'rgba(0,0,0,.6)'},rgba(0,0,0,0) 70%)"></div>`),cx-100*sc,foot-24*sc,200*sc,46*sc);
      tile(cx-88,foot-200*sc+4,u,sd,sc);
    }
  });
}

function hero(x,y,art,name,hp,charge,cap,seals,tint){
  const h=put($(`<div class="hero"></div>`),x,y);
  h.innerHTML=`<div class="breathe" style="position:absolute;left:0;top:0;width:240px;height:210px">
   <div class="abs" style="left:52px;top:32px;width:136px;height:136px;border-radius:50%;overflow:hidden"><div class="fbd" style="--t:${tint}"></div><img class="art" style="position:absolute;${artFit(art,136,136,.96,true)}" src="${A}${art}.png"></div>
   <img class="abs" src="${F}HeroFrame.png" style="left:20px;top:0;width:200px;height:200px"></div>
   <div class="abs" style="left:160px;top:124px;width:78px;height:78px"><img class="fill" src="${F}Health.png"><span class="disp center ol" style="position:absolute;inset:0;font-size:38px">${hp}</span></div>
   <img class="abs" src="${F}Nameplate.png" style="left:10px;top:196px;width:220px;height:34px">
   <div class="abs disp center ol" style="left:10px;top:196px;width:220px;height:34px;font-size:21px">${name}</div>
   ${Array.from({length:cap},(_,i)=>`<img class="abs" src="${F}ChargePip${i<charge?'On':'Off'}.png" style="left:${18+i*20.5}px;top:238px;width:20px;height:20px">`).join('')}
   <div class="abs center" style="left:0;top:258px;width:240px;height:24px;font-size:17px;color:var(--frost)">Charge ${charge}/${cap}</div>
   ${Array.from({length:6},(_,i)=>`<img class="abs" src="${F}Seal${i<seals?'Lit':'Dim'}.png" style="left:${18+i*35}px;top:286px;width:33px;height:33px">`).join('')}`;
}

// ---------------- scene (clean, Runeterra-style: board first, HUD minimal)
put($(`<img src="${A}Board.png" style="object-fit:cover;filter:brightness(.8) saturate(.95)">`),0,0,1920,1080);
put($(`<div style="background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.6) 100%)"></div>`),0,0,1920,1080);
put($(`<div style="background:linear-gradient(to bottom,rgba(4,6,10,0),rgba(4,6,10,.55) 40%,rgba(4,6,10,.88))"></div>`),0,760,1920,320);

lane(270,'West',false,0,0,[{n:'Hall Healer',art:'Units/A09',a:2,h:4,ready:true},{n:'Fisher',art:'Units/X02',a:2,h:3}],[{n:'Raider',art:'Units/H05',a:3,h:2,guard:true}],null,null);
lane(990,'East',true,2,1,[{n:'Sigrun',art:'Units/A10',a:4,h:4,leg:true,ready:true}],[{n:'Frost Warden',art:'Units/J05',a:2,h:5},{n:'Ember Thane',art:'Units/H09',a:4,h:1}],'Dawn Altar',null);

// enemy hand (backs)
for(let i=0;i<4;i++){put($(`<img src="${F}CardBack.png" style="transform:rotate(${(i-1.5)*5}deg);transform-origin:50% 0">`),850+i*44,-56+Math.abs(i-1.5)*5,96,136)}

// heroes: cut-out busts, no ring
function miniHero(x,y,art,name,hp,tint,seals,side,counts){
  const rim=side===0?'rgba(150,235,185,.9)':'rgba(255,160,120,.9)';
  const h=put($(`<div style="width:210px;height:270px"></div>`),x,y);
  h.innerHTML=`<div class="abs" style="left:10px;top:176px;width:170px;height:34px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.7),rgba(0,0,0,0) 70%)"></div>
   <div class="breathe abs" style="left:0;top:0;width:190px;height:190px"><img style="${cutFit(art,190,190)};filter:drop-shadow(0 0 1.5px ${rim}) drop-shadow(0 8px 10px rgba(0,0,0,.6))" src="${A}${art}.png"></div>
   <div class="abs" style="left:122px;top:126px;width:78px;height:78px">${hpBadge(hp,78)}</div>
   <div class="abs disp ol" style="left:0;top:206px;width:190px;text-align:center;font-size:24px">${name}</div>
   <div class="abs" style="left:0;top:240px;width:190px;display:flex;justify-content:center;gap:7px">${Array.from({length:6},(_,i)=>`<i style="width:10px;height:10px;transform:rotate(45deg);background:${i<seals?'var(--gold)':'rgba(255,255,255,.18)'}"></i>`).join('')}</div>
   <div class="abs ol" style="left:0;top:262px;width:190px;text-align:center;font-size:14px;color:var(--muted)">${counts||''}</div>`;
}
miniHero(1700,16,'Heroes/H23','Runa',15,'#a85d45',0,1,'Deck 26 · Hand 4');
miniHero(1700,452,'Heroes/A23','Thor',24,'#4f8a6a',0,0,'Deck 26 · Hand 4');
// charge (mana): crystal row with count
put($(`<div><div style="display:flex;gap:6px;align-items:center">${Array.from({length:5},(_,i)=>gem(34,i<3)).join('')}</div>
  <div class="ol" style="margin-top:6px;font-size:15px;letter-spacing:.14em;color:var(--muted)">CHARGE <b style="color:#9fdcff;font-size:18px">3</b> / 5</div></div>`),1700,764,230,70);
put($(`<div class="abs"><img class="fill" src="${F}HeroPower.png"><span class="disp center ol" style="position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;font-size:17px;background:url(${F}HeroPowerCost.png) center/contain no-repeat">2</span></div>`),1760,860,74,74);

// left HUD: text only
put($(`<div class="disp ol" style="font-size:22px;letter-spacing:.08em;color:#cfd5d8">Menu</div>`),40,26,190,30);
put($(`<div><div class="disp ol" style="font-size:40px;color:var(--gold)">Round 1</div>
  <div style="font-size:16px;color:var(--muted);margin-top:4px;line-height:1.35">Prophecy, round 3<br><span style="color:#e6e9ea">Fimbulwinter</span></div>
</div>`),40,350,235,120);
put($(`<div class="disp ol" style="font-size:24px;color:var(--sage);letter-spacing:.06em">Your turn</div>`),40,500,235,32);
put($(`<div class="disp center" style="font-size:26px;letter-spacing:.06em;color:#2a1e08;border-radius:30px;background:linear-gradient(to bottom,#ffe9a8,#e0b24a 55%,#b98a2c);box-shadow:0 0 0 2px rgba(255,236,170,.5),0 8px 22px rgba(0,0,0,.55),0 0 28px rgba(240,199,94,.45);animation:etp 2.4s ease-in-out infinite;cursor:pointer">End Turn</div>`),40,660,200,58);

// hand: every card fully visible, gentle fan
const n=CARDS.length,CW=204,CH=Math.round(590*CW/416),step=Math.min(212,1060/(n-1)),x0=960-(CW+step*(n-1))/2;
CARDS.forEach((c,i)=>{
  const t=i-(n-1)/2,tilt=t*2.2,y=1080-CH-14+Math.abs(t)*Math.abs(t)*5;
  c.glow=i!==1;
  const el=cardEl(c,CW);
  const base=`rotate(${tilt}deg)`;
  el.style.left=(x0+i*step)+'px';el.style.top=y+'px';el.style.transform=base;el.style.zIndex=i;
  el.onmouseenter=()=>{el.style.zIndex=50;el.style.transform=`translateY(-34px) scale(1.18)`};
  el.onmouseleave=()=>{el.style.zIndex=i;el.style.transform=base};
  st.appendChild(el);
});
